<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Carregando...</title>
</head>
<body>
    <header>
        <div class="containerHeader">
            <div class="logo">
                <a href="#inicio"><img id="logoHeader" src="img/logo.png" alt="logo"></a>
            </div>
            <button class="menuHamburguer" id="menuHamburguer" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menuPrincipal">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav id="menuPrincipal">
                <a href="#inicio" data-nav="inicio">início</a>
                <a href="#sobre" data-nav="sobre">sobre nós</a>
                <a href="#especialidades" data-nav="especialidades">especialidades</a>
                <a href="#equipe" data-nav="equipe">equipe</a>
                <a href="#contato" data-nav="contato">contato</a>
            </nav>
            <div class="botaocta">
                <a id="ctaHeader" href="#">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Z"/></svg>
                    <span id="ctaHeaderTexto">Agendar consulta</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="inicio" id="inicio">
            <div class="containerInicio">
                <div class="containerText">
                    <h1 id="heroTitulo"></h1>
                    <h2 id="heroDescricao"></h2>
                    <div class="buttons">
                        <a href="#" id="button1">
                            <span id="button1Texto">Agendar uma avaliação</span>
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/></svg>
                        </a>
                        <a href="#especialidades" id="button2">Nossos tratamentos</a>
                    </div>
                    <div class="stats" id="statsContainer"></div>
                </div>
                <div id="imgInicio">
                    <img id="heroImagem" src="img/Dentista sorrindo e atendendo paciente.svg" alt="Clínica">
                </div>
            </div>
        </section>

        <section class="sobre" id="sobre">
            <div class="containerSobre">
                <div class="tituloSobre">
                    <p class="sectionTag" id="sobreEtiqueta"></p>
                    <h2 id="sobreTitulo"></h2>
                    <p id="sobreDescricao" style="font-size: 1rem; color: #475569; text-align: center; font-weight: 400;"></p>
                </div>
                <div class="cartoesSobre" id="sobreCards"></div>
                <div class="beneficiosSobre" id="beneficiosSobre"><div id="beneficiosLista"></div></div>
            </div>
        </section>

        <section class="containerEspecialidades" id="especialidades">
            <div class="containerSobre" style="display: flex; flex-direction: column; gap: 4rem;">
                <div class="tituloEspecialidades">
                    <p class="sectionTag" id="especialidadesEtiqueta"></p>
                    <h2 id="especialidadesTitulo"></h2>
                    <p id="especialidadesDescricao" class="sectionDescription"></p>
                </div>
                <div class="especialidades" id="listaEspecialidades"></div>
            </div>
        </section>

        <section class="equipe" id="equipe">
            <div class="containerEquipe">
                <div class="tituloContainer">
                    <p class="sectionTag" id="equipeEtiqueta"></p>
                    <h2 class="sectionTitle" id="equipeTitulo"></h2>
                    <p class="sectionDescription" id="equipeDescricao"></p>
                </div>
                <div class="containerCartoesEquipe" id="listaEquipe"></div>
            </div>
        </section>

        <section class="contato" id="contato">
            <div class="containerContato">
                <div class="textoContato">
                    <p class="sectionTag" id="contatoEtiqueta"></p>
                    <h2 class="sectionTitle" id="contatoTitulo"></h2>
                    <p class="sectionDescription" id="contatoDescricao"></p>
                </div>
                <div class="containerLocalizacao">
                    <div class="infoLocalizacao">
                        <h3 id="contatoInformacoes"></h3>
                        <div class="cardLocalizacao"><img src="img/localizacao.svg" alt="Localização"><div class="textoLocalizacao"><h4 id="enderecoLabel"></h4><p id="endereco"></p></div></div>
                        <div class="cardLocalizacao"><img src="img/telefone.svg" alt="Telefone"><div class="textoLocalizacao"><h4 id="telefoneLabel"></h4><p id="telefone"></p></div></div>
                        <div class="cardLocalizacao"><img src="img/horario.svg" alt="Horário"><div class="textoLocalizacao"><h4 id="horarioLabel"></h4><p id="horario"></p></div></div>
                    </div>
                    <iframe id="mapa" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <section id="containerFooter">
            <div class="divFooter divNone">
                <div class="tituloFooter">
                    <img id="logoFooter" src="img/logoFooter.svg" alt="Logo da clínica">
                    <h3 id="footerNome" style="font-size: 1.25rem; font-weight: 800;"></h3>
                </div>
                <p id="footerDescricao" style="color: #94A3B8;"></p>
            </div>
            <div class="divFooter">
                <h4>NAVEGAÇÃO</h4>
                <nav class="navFooter">
                    <a href="#inicio" data-nav="inicio">Início</a><a href="#sobre" data-nav="sobre">Sobre Nós</a><a href="#especialidades" data-nav="especialidades">Especialidades</a><a href="#equipe" data-nav="equipe">Equipe</a><a href="#contato" data-nav="contato">Contato</a>
                </nav>
            </div>
            <div class="divFooter">
                <h4>REDES SOCIAIS</h4>
                <nav class="redesSociaisFooter">
                    <a id="instagram" href="#"><img src="img/instaFooter.svg" alt="Instagram"></a>
                    <a id="facebook" href="#"><img src="img/facebook.svg" alt="Facebook"></a>
                    <a id="youtube" href="#"><img src="img/yt.svg" alt="Youtube"></a>
                </nav>
            </div>
        </section>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
